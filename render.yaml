services:
  - type: web
    name: wordgame-2
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Statistics
        sync: false
